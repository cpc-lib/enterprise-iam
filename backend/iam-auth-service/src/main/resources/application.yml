spring:
  application:
    name: iam-auth-service
  main:
    banner-mode: "off"
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      pool-name: iam-auth-service-pool
      maximum-pool-size: ${DB_MAX_POOL_SIZE:10}
      minimum-idle: ${DB_MIN_IDLE:1}
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:3000}
  flyway:
    enabled: true
    locations: classpath:db/migration
    clean-disabled: true
    validate-on-migrate: true
    out-of-order: false
    baseline-on-migrate: false

server:
  port: ${SERVER_PORT:8081}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

iam:
  auth:
    session-issuance:
      enabled: ${IAM_AUTH_SESSION_ISSUANCE_ENABLED:false}
      idle-ttl: ${IAM_AUTH_SESSION_IDLE_TTL:1d}
      absolute-ttl: ${IAM_AUTH_SESSION_ABSOLUTE_TTL:30d}
      refresh-token-ttl: ${IAM_AUTH_REFRESH_TOKEN_TTL:14d}
      maximum-concurrent-sessions: ${IAM_AUTH_MAX_CONCURRENT_SESSIONS:10}
      transaction-timeout: ${IAM_AUTH_SESSION_TRANSACTION_TIMEOUT:5s}
  outbox:
    relay:
      enabled: ${IAM_OUTBOX_RELAY_ENABLED:false}
      batch-size: ${IAM_OUTBOX_BATCH_SIZE:50}
      max-attempts: ${IAM_OUTBOX_MAX_ATTEMPTS:10}
      poll-delay: ${IAM_OUTBOX_POLL_DELAY:1s}
      lease-duration: ${IAM_OUTBOX_LEASE_DURATION:30s}
      initial-backoff: ${IAM_OUTBOX_INITIAL_BACKOFF:1s}
      maximum-backoff: ${IAM_OUTBOX_MAXIMUM_BACKOFF:5m}
