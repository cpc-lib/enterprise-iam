spring:
  application:
    name: iam-authorization-service
  main:
    banner-mode: "off"
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      pool-name: iam-authorization-service-pool
      maximum-pool-size: ${DB_MAX_POOL_SIZE:10}
      minimum-idle: ${DB_MIN_IDLE:1}
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:3000}
  flyway:
    enabled: true
    locations: classpath:db/migration
    clean-disabled: true
    validate-on-migrate: true
    out-of-order: false
    baseline-on-migrate: false

server:
  port: ${SERVER_PORT:8084}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

iam:
  security:
    delegation:
      enabled: ${IAM_DELEGATION_ENABLED:false}
      issuer: iam-gateway
      audience: iam-authorization-service
      protected-paths:
        - /internal/**
      maximum-ttl: 30s
      clock-skew: 5s
      jwks-cache-ttl: 5m
      unknown-key-ttl: 30s
      unknown-key-refresh-minimum-interval: 5s
