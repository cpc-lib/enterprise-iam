spring:
  application:
    name: iam-file-service
  main:
    banner-mode: "off"
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/iam_file?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    hikari:
      pool-name: iam-file-service-pool
      maximum-pool-size: ${DB_MAX_POOL_SIZE:10}
      minimum-idle: ${DB_MIN_IDLE:1}
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:3000}
  flyway:
    enabled: true
    locations: classpath:db/migration
    clean-disabled: true
    validate-on-migrate: true
    out-of-order: false
    baseline-on-migrate: false

server:
  port: ${SERVER_PORT:8086}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    arg-name-based-constructor-auto-mapping: true

iam:
  file:
    enabled: ${IAM_FILE_ENABLED:true}
    node-id: ${IAM_FILE_NODE_ID:3}
    # In-process scan & lifecycle workers (SPEC 35). All workers fail-safe default off;
    # the scanner adapter defaults to the local deterministic policy.
    scan:
      enabled: ${IAM_FILE_SCAN_ENABLED:false}
      adapter: ${IAM_FILE_SCAN_ADAPTER:local}
      poll-interval: 5s
      claim-batch-size: 20
      max-attempts: 3
      backoff-base: 30s
      backoff-cap: 10m
      scan-required: ${IAM_FILE_SCAN_REQUIRED:true}
      blocked-extensions:
        - exe
        - bat
        - cmd
        - scr
        - msi
        - ps1
        - vbs
        - jar
        - sh
    reaper:
      enabled: ${IAM_FILE_REAPER_ENABLED:false}
      poll-interval: 60s
    quota-reconcile:
      enabled: ${IAM_FILE_QUOTA_RECONCILE_ENABLED:false}
      poll-interval: 5m
    purge:
      enabled: ${IAM_FILE_PURGE_ENABLED:false}
      poll-interval: 10m
      default-retention-days: 30
      # noop = DEV logging adapter (no real delete); minio = production MinIO/S3 delete (D-18).
      storage: ${IAM_FILE_PURGE_STORAGE:noop}
      minio:
        endpoint: ${IAM_FILE_PURGE_MINIO_ENDPOINT:}
        access-key: ${IAM_FILE_PURGE_MINIO_ACCESS_KEY:}
        secret-key: ${IAM_FILE_PURGE_MINIO_SECRET_KEY:}
  idempotency:
    enabled: ${IAM_IDEMPOTENCY_ENABLED:false}
    paths:
      - /api/v1/file-uploads
      - /api/v1/file-uploads/**
      - /api/v1/files/*/references
      - /api/v1/files/*/download
      - /api/v1/files/*/preview
      - /api/v1/files/*/delete
  security:
    delegation:
      enabled: ${IAM_DELEGATION_ENABLED:false}
      issuer: iam-gateway
      audience: iam-file-service
      protected-paths:
        - /api/v1/files/**
      maximum-ttl: 30s
      clock-skew: 5s
      jwks-cache-ttl: 5m
      unknown-key-ttl: 30s
      unknown-key-refresh-minimum-interval: 5s
      # Gateway delegation JWKS (auto-configured loader; required when delegation is enabled
      # and no custom DelegationJwkSetLoader bean exists). Plain http is DEV-ONLY.
      jwks-uri: ${IAM_DELEGATION_JWKS_URI:}
      jwks-allowed-hosts: ${IAM_DELEGATION_JWKS_ALLOWED_HOSTS:}
      jwks-allow-http: ${IAM_DELEGATION_JWKS_ALLOW_HTTP:false}
