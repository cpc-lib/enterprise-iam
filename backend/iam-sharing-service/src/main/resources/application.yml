spring:
  application:
    name: iam-sharing-service
  main:
    banner-mode: "off"
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/iam_sharing?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    hikari:
      pool-name: iam-sharing-service-pool
      maximum-pool-size: ${DB_MAX_POOL_SIZE:10}
      minimum-idle: ${DB_MIN_IDLE:1}
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:3000}
  flyway:
    enabled: true
    locations: classpath:db/migration
    clean-disabled: true
    validate-on-migrate: true
    out-of-order: false
    baseline-on-migrate: false

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    arg-name-based-constructor-auto-mapping: true

iam:
  sharing:
    enabled: ${IAM_SHARING_ENABLED:true}
    node-id: ${IAM_SHARING_NODE_ID:1}
    seata:
      enabled: ${IAM_SHARING_SEATA_ENABLED:false}
      mode: ${IAM_SHARING_SEATA_MODE:AT}
      require-global-tx: ${IAM_SHARING_SEATA_REQUIRE_GLOBAL_TX:false}
      tx-service-group: ${IAM_SHARING_SEATA_TX_SERVICE_GROUP:default_tx_group}
  idempotency:
    enabled: ${IAM_IDEMPOTENCY_ENABLED:false}
    paths: [/api/v1/shares, /api/v1/shares/*/revoke, /api/v1/shares/*/reshare]
  mq:
    enabled: ${IAM_MQ_ENABLED:false}
    host: ${IAM_MQ_HOST:rabbitmq}
    port: ${IAM_MQ_PORT:5672}
    virtual-host: ${IAM_MQ_VIRTUAL_HOST:/}
    username: ${IAM_MQ_USERNAME:guest}
    password: ${IAM_MQ_PASSWORD:guest}
    exchange-name: ${IAM_MQ_EXCHANGE_NAME:iam.domain.events}
  outbox:
    relay:
      enabled: ${IAM_OUTBOX_RELAY_ENABLED:false}
      batch-size: ${IAM_OUTBOX_BATCH_SIZE:50}
      max-attempts: ${IAM_OUTBOX_MAX_ATTEMPTS:10}
      poll-delay: ${IAM_OUTBOX_POLL_DELAY:1s}
      lease-duration: ${IAM_OUTBOX_LEASE_DURATION:30s}
      initial-backoff: ${IAM_OUTBOX_INITIAL_BACKOFF:1s}
      maximum-backoff: ${IAM_OUTBOX_MAXIMUM_BACKOFF:5m}

server:
  port: ${SERVER_PORT:8085}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
