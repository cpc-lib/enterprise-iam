spring:
  application:
    name: iam-audit-service
  main:
    banner-mode: "off"
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/iam_audit?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    hikari:
      pool-name: iam-audit-service-pool
      maximum-pool-size: ${DB_MAX_POOL_SIZE:10}
      minimum-idle: ${DB_MIN_IDLE:1}
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:3000}
  flyway:
    enabled: true
    locations: classpath:db/migration
    clean-disabled: true
    validate-on-migrate: true
    out-of-order: false
    baseline-on-migrate: false

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    arg-name-based-constructor-auto-mapping: true

iam:
  audit:
    enabled: ${IAM_AUDIT_ENABLED:true}
    node-id: ${IAM_AUDIT_NODE_ID:1}
    auth-login:
      queue: ${IAM_AUDIT_AUTH_LOGIN_QUEUE:iam.audit.auth-login}
    olap:
      engine: ${IAM_AUDIT_OLAP_ENGINE:relational}
      archive-target: ${IAM_AUDIT_OLAP_ARCHIVE_TARGET:s3://iam-audit-cold-archive/v2/parquet}
  mq:
    enabled: ${IAM_MQ_ENABLED:false}
    host: ${IAM_MQ_HOST:rabbitmq}
    port: ${IAM_MQ_PORT:5672}
    virtual-host: ${IAM_MQ_VIRTUAL_HOST:/}
    username: ${IAM_MQ_USERNAME:guest}
    password: ${IAM_MQ_PASSWORD:guest}
    exchange-name: ${IAM_MQ_EXCHANGE:iam.domain.events}

server:
  port: ${SERVER_PORT:8087}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
